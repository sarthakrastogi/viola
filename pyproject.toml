[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "viola"
version = "0.1.1"
description = "On-device prompt router for coding agents: picks the right model tier for every prompt with an open Jev-style decision model."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
authors = [{ name = "Sarthak Rastogi" }]
dependencies = [
    "aiohttp>=3.9",
    "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
# The classifier. Kept optional so the proxy/tests can be installed without torch;
# install.sh always installs it (with CPU-only torch).
model = [
    "torch>=2.4",
    "gliner2>=2.0",
    "transformers>=4.51",
    "peft>=0.13",
    "sentencepiece>=0.2",
    "huggingface_hub>=0.30",
]
# Claude Code on Amazon Bedrock: Viola signs requests locally with SigV4.
bedrock = ["botocore>=1.34"]
dev = ["pytest>=8", "botocore>=1.34"]

[project.scripts]
viola = "viola.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/viola"]

[tool.pytest.ini_options]
testpaths = ["tests"]
